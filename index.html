<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Sesc Bertioga</title>
<meta name="theme-color" content="#173B30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sesc Bertioga">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F1EC; --surface:#FFFFFF; --surface2:#F3F8F5; --ink:#173B30; --ink2:#4D6A60; --line:#CFE0D8;
  --mar:#1F7A80; --mata:#173B30; --coral:#DE3F2C; --sol:#F2B33D; --dot:#1E6BFF;
  --shadow:0 1px 2px rgba(23,59,48,.08),0 6px 18px rgba(23,59,48,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E231D; --surface:#163229; --surface2:#1B3B31; --ink:#E5F1EC; --ink2:#A2BDB3; --line:#28493E;
    --mar:#4DB3B5; --mata:#0E231D; --coral:#FF6B55; --sol:#F2B33D; --dot:#4C8DFF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E231D; --surface:#163229; --surface2:#1B3B31; --ink:#E5F1EC; --ink2:#A2BDB3; --line:#28493E;
  --mar:#4DB3B5; --mata:#0E231D; --coral:#FF6B55; --sol:#F2B33D; --dot:#4C8DFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mata)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
a{color:var(--mar)}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:640px;margin:0 auto;position:relative}
header.top{background:var(--mata);color:#E9F4EF;padding:14px 18px 16px;position:relative;overflow:hidden}
header.top h1{font:400 1.45rem/1.15 "Young Serif",Georgia,serif;margin:0}
header.top p{margin:2px 0 0;font-size:.9rem;color:#A9CDBF}
header.top svg.wave{position:absolute;right:-10px;bottom:-6px;width:150px;opacity:.35}
main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{display:none;padding:16px 16px 28px}
.view.on{display:block}
#mapa.view{padding:0;height:100%}
#mapa.view.on{display:flex;flex-direction:column}
h2{font:400 1.25rem/1.25 "Young Serif",Georgia,serif;margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:1rem;margin:0}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:.72rem;font-weight:600;color:var(--ink2)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--mar)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}

.alert{border-radius:16px;padding:14px 16px;margin:0 0 12px;background:var(--coral);color:#fff}
.alert h3{font-size:1.02rem}
.alert p{margin:4px 0 8px;font-size:.92rem}
.alert ul{margin:6px 0 0;padding:0;list-style:none}
.alert li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.28);font-size:.92rem}
.alert li button{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.alert.calm{background:var(--mar)}
.alert.sun{background:var(--sol);color:#2A2205}
.alert.sun li{border-color:rgba(0,0,0,.15)}

.clock{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px}
.clock b{font:400 2.6rem/1 "Young Serif",Georgia,serif}
.clock span{color:var(--ink2)}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;text-align:left;width:100%;background:var(--surface);border-radius:14px;padding:12px 12px 12px 0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.item .t{padding-left:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.item .t small{display:block;font-weight:500;color:var(--ink2);font-size:.78rem}
.item .nm{font-weight:700;line-height:1.3}
.item .meta{font-size:.84rem;color:var(--ink2);margin-top:2px}
.item .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.item .star{font-size:1.3rem;line-height:1;color:var(--line);padding:2px 4px}
.item .star.on{color:var(--sol)}
.item.past{opacity:.5}
.item.now{outline:2px solid var(--mar)}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.cat{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
:root[data-theme="dark"] .tag.cat{color:color-mix(in srgb,var(--c) 55%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.cat{color:color-mix(in srgb,var(--c) 55%,#fff)}}
.tag.insc{background:#FDE3DF;color:#A3271A}
.tag.insc30{background:#FFF0CF;color:#7A5300}
.tag.free{background:#DDF1E5;color:#1E6A3D}
.tag.soon{background:var(--mar);color:#fff}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.cat[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.day{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 10px;border-radius:14px}
.day b{font:400 1.35rem/1.1 "Young Serif",Georgia,serif}
.day span{font-size:.75rem}
.period{font-size:.85rem;font-weight:700;color:var(--ink2);margin:16px 0 6px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink2);margin:4px 0 0}
.toggle input{width:18px;height:18px;accent-color:var(--mar)}
.empty{background:var(--surface);border-radius:14px;padding:18px;text-align:center;color:var(--ink2)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,25,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88%;background:var(--surface);border-radius:22px 22px 0 0;z-index:41;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:0 0 auto}
.sheet .body{overflow-y:auto;padding:12px 20px 24px}
.sheet .hd{border-left:6px solid var(--c);padding-left:12px;margin:6px 0 14px}
.sheet .hd h3{font:400 1.35rem/1.2 "Young Serif",Georgia,serif;margin:4px 0}
.sec{margin:14px 0}
.sec h4{margin:0 0 3px;font-size:.92rem;display:flex;align-items:center;gap:6px}
.sec p{margin:0;color:var(--ink)}
.sec .ic{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;background:var(--surface2);font-size:.85rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--surface2);text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--mar);color:#fff}
.btn.full{flex:1}
.close{position:absolute;right:14px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--surface2);font-size:1.2rem}

/* map */
.mapwrap{position:relative;flex:1;overflow:hidden;touch-action:none;background:#E6E0D2;user-select:none;-webkit-user-select:none}
#layer{position:absolute;left:0;top:0;transform-origin:0 0}
#layer img{display:block;pointer-events:none;-webkit-user-drag:none}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-15px,-50%);display:flex;align-items:center;gap:4px}
.pin i{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--c);display:grid;place-items:center;font-style:normal;font-size:15px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.28);flex:0 0 auto}
.pin span{display:none;font-size:.75rem;font-weight:700;background:var(--surface);color:var(--ink);border-radius:7px;padding:2px 7px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pin.lbl span{display:block}
.pin.tiny{transform:translate(-9px,-50%)}
.pin.tiny i{width:18px;height:18px;font-size:9px;border-width:2px}
.pin.dest{transform:translate(-21px,-50%);z-index:2}
.pin.dest i{width:42px;height:42px;font-size:21px;border:3px solid var(--coral);box-shadow:0 0 0 7px rgba(222,63,44,.28)}
.pin.dest span{background:var(--coral);color:#fff;font-size:.82rem}
.me{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.me .acc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(30,107,255,.15);border:1px solid rgba(30,107,255,.4)}
.me .d{position:relative;width:20px;height:20px;border-radius:50%;background:var(--dot);border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,107,255,.25)}
.me .cone{position:absolute;left:50%;top:50%;width:44px;height:44px;transform-origin:50% 100%;background:radial-gradient(circle at 50% 100%,rgba(30,107,255,.55),rgba(30,107,255,0) 70%);clip-path:polygon(50% 100%,10% 0,90% 0)}
.me .hdg{position:absolute;left:50%;top:50%;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--dot);transform-origin:50% 26px;margin-left:-9px;margin-top:-26px;display:none}
.calpt{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border:3px solid var(--sol);border-radius:50%;background:rgba(242,179,61,.35)}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.mapctl button{width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.mapctl button svg{width:24px;height:24px}
.mapctl button.on{background:var(--dot);color:#fff}
.mapsearch{position:absolute;left:10px;top:10px;right:66px;z-index:3}
.mapsearch button{width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);color:var(--ink2);font-weight:600}
.navbar{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:none;align-items:center;gap:12px}
.navbar.on{display:flex}
.navbar .arrow{width:46px;height:46px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.navbar .arrow svg{width:26px;height:26px;transition:transform .3s}
.navbar .txt{flex:1;min-width:0}
.navbar .txt b{display:block;font-size:1.15rem;line-height:1.2}
.navbar .txt span{font-size:.85rem;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .x{width:36px;height:36px;border-radius:50%;background:var(--surface2);flex:0 0 auto}
.calbar{position:absolute;left:10px;right:10px;top:108px;z-index:4;background:var(--sol);color:#2A2205;border-radius:16px;padding:12px 14px;display:none;font-size:.92rem;box-shadow:var(--shadow)}
.calbar.on{display:block}
.calbar b{display:block;margin-bottom:2px}
.calbar .btnrow{margin-top:8px}
.calbar .btn{background:rgba(255,255,255,.65);color:#2A2205;padding:8px 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;transition:.25s;z-index:60;max-width:90%;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

.card{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.card h3{margin-bottom:6px}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.93rem}
.rows span:nth-child(even){font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.stamp{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.stamp input{width:26px;height:26px;margin-top:2px;accent-color:var(--mar)}
.stamp .btn{padding:7px 12px;font-size:.88rem;margin-top:8px}
.progress{height:10px;border-radius:9px;background:var(--surface);overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--mar);border-radius:9px;transition:width .3s}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.88rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend span::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c);flex:0 0 auto}
.placelist button{display:block;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.placelist button{display:flex;gap:10px;align-items:flex-start}
.placelist .pi{font-size:1.2rem;line-height:1.3}
.placelist button small{display:block;color:var(--ink2)}
.mapchips{position:absolute;left:0;right:66px;top:62px;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:0 10px 4px;scrollbar-width:none}
.mapchips::-webkit-scrollbar{display:none}
.mapchips .chip{box-shadow:var(--shadow);font-size:.82rem;padding:5px 11px}
#north{width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:none;place-items:center;color:var(--ink)}
#north svg{width:30px;height:30px;transition:transform .3s}
#gpsPill{position:absolute;left:10px;bottom:12px;z-index:3;background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow);display:none;max-width:calc(100% - 20px)}
.netpill{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:700;background:var(--sol);color:#2A2205;border-radius:999px;padding:2px 10px}
.install{background:var(--mar);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.install h3{color:#fff;margin-bottom:4px}
.install p,.install ol{margin:4px 0;font-size:.9rem}
.install ol{padding-left:20px}
.install .btn{background:#fff;color:var(--mar)}
/* mapa vetorial */
.pin.num i{background:var(--c);border-color:#fff;color:#fff;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.pin.num i b{font-weight:800}
.pin.tiny.num i{font-size:9px}
.pin.dup{opacity:.92}
.pin.room i{background:#fff;border-color:var(--c)}
.pin.dest.num i{background:var(--c);border-color:#fff;font-size:17px}
#vmap text{font-family:Figtree,system-ui,sans-serif}
#vmap .m-st{font-size:9px;font-weight:600;fill:#4F4A3E;letter-spacing:.3px;paint-order:stroke;stroke:#D7D2C6;stroke-width:2.5px}
#vmap .m-lc{font-size:8.5px;font-weight:800;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#5A1D10;stroke-width:2.6px;letter-spacing:.4px}
#vmap .m-hn{font-size:6.5px;font-weight:800;fill:#fff;text-anchor:middle}
#vmap .m-ocean{font-family:"Young Serif",Georgia,serif;font-size:34px;fill:#fff;opacity:.55;letter-spacing:8px;text-anchor:middle}
#vmap .m-praia{font-family:"Young Serif",Georgia,serif;font-size:18px;font-style:italic;fill:#9B7A45;text-anchor:middle}
#vmap .m-ctx{font-size:11px;font-weight:600;fill:#8A826F;text-anchor:middle}
#vmap .m-tag{font-size:10px;font-weight:800;fill:#5B6168;text-anchor:middle;letter-spacing:1px}
#vmap .m-wc{font-size:6px;font-weight:800;fill:#55606A;text-anchor:middle}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #vmap{filter:brightness(.86) saturate(.95)}}
:root[data-theme="dark"] #vmap{filter:brightness(.86) saturate(.95)}
.plq{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.placelist .pi{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:1rem}
.placelist .pi b{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.82rem}
.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:6px 0 12px}
.roomgrid button{height:42px;border-radius:10px;background:var(--surface2);font-weight:700;color:var(--ink)}
.roomgrid button:active{background:var(--mar);color:#fff}

:root{--m-land:#D5E8C9;--m-zone:#C6DEB8;--m-zone2:#CBE1BE;--m-zone3:#E6EFD6;--m-tree:#A9CF98;--m-road:#FFFFFF;--m-roadc:#AFC7A6;--m-trail:#D9A35F;--m-bld:#E3977A;--m-bld2:#E6DDD0;--m-sand:#F2E2B8;--m-sea:#79C3CF;--m-foam:#FFFFFF;--m-field:#8DC27A;--m-court:#5FA3A0;--m-water:#8ED0DE;--m-park:#DCDFD8;--m-txt:#3C6152}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m-land:#1C372D;--m-zone:#20402F;--m-zone2:#1F3D31;--m-zone3:#284638;--m-tree:#244A39;--m-road:#4A6A5D;--m-roadc:#132A22;--m-trail:#8C6A3C;--m-bld:#9B5A45;--m-bld2:#3D514A;--m-sand:#6E6142;--m-sea:#1D5C68;--m-foam:#5FA0AA;--m-field:#2F6340;--m-court:#2C5E5C;--m-water:#2A6E7A;--m-park:#34453F;--m-txt:#9DC2B4}}
:root[data-theme="dark"]{--m-land:#1C372D;--m-zone:#20402F;--m-zone2:#1F3D31;--m-zone3:#284638;--m-tree:#244A39;--m-road:#4A6A5D;--m-roadc:#132A22;--m-trail:#8C6A3C;--m-bld:#9B5A45;--m-bld2:#3D514A;--m-sand:#6E6142;--m-sea:#1D5C68;--m-foam:#5FA0AA;--m-field:#2F6340;--m-court:#2C5E5C;--m-water:#2A6E7A;--m-park:#34453F;--m-txt:#9DC2B4}
#vmap{display:block}
#vmap .m-land{fill:var(--m-land)} #vmap .m-zone{fill:var(--m-zone)} #vmap .m-zone2{fill:var(--m-zone2)} #vmap .m-zone3{fill:var(--m-zone3)}
#vmap .m-tree{fill:var(--m-tree);opacity:.75} #vmap .m-sand{fill:var(--m-sand)} #vmap .m-sea{fill:var(--m-sea)}
#vmap .m-foam{fill:none;stroke:var(--m-foam);stroke-width:5;opacity:.8} #vmap .m-wave{fill:none;stroke:var(--m-foam);stroke-width:3;opacity:.5}
#vmap .m-umb{fill:#E8714F;opacity:.7}
#vmap .m-roadc{fill:none;stroke:var(--m-roadc);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
#vmap .m-road{fill:none;stroke:var(--m-road);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
#vmap .m-trail{fill:none;stroke:var(--m-trail);stroke-width:5;stroke-dasharray:2 8;stroke-linecap:round}

 passarinhar:'<p><b>Como funciona:</b> você vai ao balcão da Biblioteca, pega o kit Passarinhar (binóculo e guia de identificação das aves) e sai sozinho ou em grupo pelas alamedas, no seu tempo. Depois devolve o kit no mesmo balcão.</p><p><b>Por que vale:</b> o Sesc fica entre a Serra do Mar e o oceano, e o Projeto Avifauna, um dos projetos ambientais mais antigos do Sesc (desde 1992), já catalogou mais de 300 espécies na unidade. Muitas aves moram aqui e outras só passam na migração.</p><p><b>Dicas:</b> o começo da manhã e o fim da tarde são os horários com mais movimento de aves. Ande devagar, fale baixo e procure perto do Lago, do Bosque das Aves e do Viveiro de Plantas. Os quero-queros podem dar voos rasantes se você chegar perto do ninho; é só se afastar.</p>',
 conexao:'<p><b>Como funciona:</b> o grupo sai da Marquise do Restaurante com os Agentes de Educação Ambiental e vai até a praia de São Lourenço, mais ao norte de Bertioga. Lá, a conversa liga o surfe, a vida marinha e as áreas protegidas da região, como o Parque Estadual da Restinga de Bertioga. Dura cerca de 3 horas.</p><p><b>Por que vale:</b> é um jeito de conhecer outra praia da cidade com explicação de quem estuda o lugar. Não exige saber surfar.</p><p><b>Dicas:</b> vá com roupa de banho por baixo, porque costuma dar para entrar no mar. Leve água, já que boa parte do tempo é ao sol.</p>',
 alongamento:'<p><b>Como funciona:</b> aula aberta conduzida por um educador físico na Estação Vivência, que fica na praia. Exercícios de alongamento e flexibilidade, em ritmo calmo, por cerca de 1 hora.</p><p><b>Para quem é:</b> qualquer adulto, mesmo sedentário. Cada um vai até onde o corpo permite.</p><p><b>Dica:</b> é uma boa forma de começar o dia depois do café, ainda com o sol fraco.</p>',
 beach:'<p><b>Como funciona:</b> educadores montam as duplas nas quadras de areia e ensinam o básico. O beach tennis usa raquete sólida (sem cordas) e bola de tênis mais macia; a bola não pode quicar no chão, então o jogo lembra o vôlei com raquete.</p><p><b>Por que vale:</b> é fácil de aprender e já em poucos minutos dá para trocar bolas. Muito social.</p><p><b>Dicas:</b> areia quente queima pela manhã também; se estiver muito quente, molhe os pés antes. Use óculos de sol presos para não perder no movimento.</p>',
 reserva:'<p><b>O que é:</b> uma área de floresta alta de restinga, um tipo de Mata Atlântica que cresce sobre a areia perto do mar, com cerca de 60 hectares, o tamanho de uns 60 campos de futebol. Fica do lado de fora do Centro de Férias, a uns 700 m da entrada, na Av. Francisco Soto Barreiro Filho, 1.117.</p><p><b>O que tem lá:</b> trilhas como a Trilha do Sentir (acessível e pensada para os sentidos), a Trilha do Tucum e trechos suspensos, além do Jardim das Brincadeiras. Já foram registradas centenas de espécies de plantas e animais.</p><p><b>Como funciona:</b> a visita mediada sai da Marquise do Restaurante às 10h e às 15h30, de quarta a sábado. Os ingressos são limitados e retirados no Balcão da Biblioteca até 30 minutos antes. Fora da visita guiada, a Reserva fica aberta das 9h às 17h.</p><p><b>Dicas:</b> repelente é obrigatório na prática. Vale levar o celular para fotos e ir de tênis.</p>',
 ritmos:'<p><b>Como funciona:</b> um educador puxa passos simples e repetidos, e o grupo acompanha. As músicas são conhecidas, de vários estilos. De manhã acontece na praia; no sábado à noite, na Lanchonete.</p><p><b>Para quem é:</b> todo mundo, inclusive quem nunca dançou. Ninguém fica avaliando, a ideia é se divertir.</p><p><b>Dica:</b> a versão da noite é um bom aquecimento antes do show que vem em seguida.</p>',
 massagem:'<p><b>Como funciona:</b> você senta numa cadeira de massagem (aquela em que se apoia o rosto para frente) e recebe 10 minutos de massagem vestido. As técnicas são o shiatsu, de origem japonesa, que usa pressão com os dedos, e o anmá, uma massagem oriental com movimentos de amassar e deslizar.</p><p><b>Inscrição:</b> as vagas são poucas. A inscrição é no dia anterior, das 9h às 20h, no Balcão da Biblioteca, e o sorteio sai às 21h30 na TV perto da Biblioteca.</p><p><b>Dicas:</b> chegue alguns minutos antes. Avise o terapeuta se tiver alguma dor ou lesão.</p>',
 cicloconhecendo:'<p><b>Como funciona:</b> o grupo se encontra na Portaria da Praia, recebe as bicicletas e pedala com um educador pelas alamedas do Sesc, parando em pontos com histórias do lugar, como a Capela de 1948, onde tudo começou.</p><p><b>Por que vale:</b> é a melhor forma de entender o mapa logo no início da estadia. Ritmo tranquilo, terreno plano.</p><p><b>Dicas:</b> calçado fechado. Leve água presa no corpo ou numa mochila pequena.</p>',
 radical:'<p><b>Como funciona:</b> uma fita de slackline é esticada entre dois pontos, bem perto da areia, e os educadores propõem desafios de equilíbrio, primeiro com apoio e depois sozinho.</p><p><b>Por que vale:</b> treina equilíbrio, concentração e é engraçado de ver e de fazer. Cair na areia não machuca.</p><p><b>Dica:</b> descalço funciona melhor que de tênis.</p>',
 escalda:'<p><b>Como funciona:</b> primeiro você caminha descalço pelo Caminho dos Seixos Rolados, que imita um córrego com pedrinhas e água corrente e massageia a sola dos pés. Depois senta e coloca os pés numa bacia de água morna com sais e óleos aromáticos. São 30 minutos no total, com 10 vagas às 16h e 10 vagas às 16h30.</p><p><b>Inscrição:</b> no dia anterior, das 9h às 20h, no Balcão da Biblioteca. Sorteio às 21h30 na TV.</p><p><b>Dicas:</b> leve sua toalha (o Sesc pede). Bom depois de um dia de praia ou caminhada.</p>',
 bazar:'<p><b>O que é:</b> nas quintas à noite, artesãos de Bertioga montam barracas no Jardim da Convivência com peças feitas à mão, muitas inspiradas na Mata Atlântica e no mar: marcenaria, tecidos, cerâmica e pintura.</p><p><b>Por que vale:</b> lembranças da viagem feitas na própria cidade, e o dinheiro fica com quem produz.</p><p><b>Dicas:</b> o pagamento é direto com cada artesão; tenha Pix ou dinheiro, porque nem todos aceitam cartão. Funciona das 19h às 22h.</p>',
 caos:'<p><b>Como funciona:</b> o espaço do jardim vira um tabuleiro gigante. Os participantes são as peças, jogam o dado e procuram as casas espalhadas pelo jardim, cada uma com uma tarefa ou surpresa.</p><p><b>Para quem é:</b> famílias e grupos de amigos. Adultos sozinhos também entram, mas o clima é bem familiar.</p>',
 plock:'<p><b>O que é:</b> o show Festa das Décadas, da banda Plock!, com sucessos dos anos 70, 80 e 90, como Dancing Queen, Take on Me e músicas de Grease, além de hits nacionais. Com Érika Mamede na voz e Evandro Neves na voz e violão, mais banda de apoio.</p><p><b>Como funciona:</b> na Lanchonete, de graça, sem inscrição. Começa às 21h e vai até 22h30.</p><p><b>Dica:</b> chegue uns 15 minutos antes para pegar mesa perto do palco.</p>',
 barco:'<p><b>Como funciona:</b> o grupo sai da Marquise do Restaurante e segue até o embarque. O barco navega pelo Canal de Bertioga, o braço de mar que separa o continente da Ilha de Santo Amaro (Guarujá), entre manguezais e com a Serra do Mar ao fundo. No caminho, a explicação passa pela história da cidade e pela vida das comunidades e da natureza da região. Duração de 3h30.</p><p><b>Por que vale:</b> o canal é uma das paisagens mais bonitas da cidade, e do barco dá para ver o Forte São João, a fortificação histórica na entrada do canal.</p><p><b>Inscrição:</b> no dia anterior, das 9h às 20h, no Balcão da Biblioteca. Sorteio às 21h30.</p><p><b>Dicas:</b> mesmo com sol, venta no barco; um corta-vento fino ajuda. Quem enjoa fácil deve comer algo leve antes.</p>',
 caixinha:'<p><b>Como funciona:</b> oficina com os Agentes de Educação Ambiental no Centro de Educação Ambiental. Cada pessoa monta e decora uma caixa para guardar lembranças da viagem, usando materiais naturais. Duração de 1h30.</p><p><b>Por que vale:</b> é tranquila, criativa e você leva a caixa pronta para casa.</p>',
 volei:'<p><b>Como funciona:</b> o encontro é na Portaria da Praia. Os educadores sorteiam times mistos e organizam partidas curtas, em formato de minitorneio. O foco é a diversão, não o nível técnico.</p><p><b>Dicas:</b> beba água entre as partidas. Protetor solar resistente à água dura mais.</p>',
 mobilidade:'<p><b>Como funciona:</b> aula na Estação Vivência com movimentos circulares e suaves de pescoço, ombros, quadril, joelhos e tornozelos, para dar mais amplitude às articulações.</p><p><b>Para quem é:</b> qualquer adulto. Boa opção para quem acorda travado ou dirigiu muito para chegar.</p>',
 hidro:'<p><b>Como funciona:</b> aula em grupo dentro da piscina do Parque Aquático, com exercícios de força, resistência e flexibilidade, passos de dança e brincadeiras. A água reduz o impacto nas articulações.</p><p><b>Para quem é:</b> todas as idades e condicionamentos. Não precisa saber nadar, a aula é na parte rasa.</p>',
 madeiras:'<p><b>Como funciona:</b> oficina do coletivo Naturalis Arte em Madeira no Espaço de Tecnologias e Artes. Com retalhos de madeira de marcenaria e de poda, cada um aprende técnicas básicas (lixar, montar, colar, desenhar) e cria seu próprio objeto ou brinquedo. Dura 3 horas.</p><p><b>Por que vale:</b> você sai com uma peça feita por você, e é uma atividade que adultos também aproveitam muito.</p><p><b>Inscrição:</b> no dia anterior, no Balcão da Biblioteca.</p>',
 bambole:'<p><b>Como funciona:</b> no Jardim da Convivência, educadores apresentam várias formas de brincar com bambolê, sozinho ou em grupo. É uma atividade mais voltada às crianças e famílias.</p>',
 purosuco:'<p><b>O que é:</b> espetáculo de circo com quatro artistas que retratam, com humor e poesia visual, o fim de uma feira de rua, a hora da xepa. Tem bicicleta acrobática, acrobacias em grupo, mão a mão e parada de mãos.</p><p><b>Como funciona:</b> na Lanchonete, de graça, das 21h às 22h.</p>',
 luau:'<p><b>O que é:</b> show ao ar livre no Espaço Sol e Lua com Waldex Brito, cantor e sanfoneiro radicado em São Sebastião, no litoral norte. O repertório tem clássicos da música sertaneja e do forró.</p><p><b>Como funciona:</b> das 22h às 23h15, de graça, sem inscrição.</p><p><b>Dicas:</b> fica perto da praia, então venta. Um casaco leve e repelente ajudam.</p>',
 movimento:'<p><b>Como funciona:</b> aula na Estação Vivência que junta movimento, técnicas de respiração e diferentes formas de trabalhar o corpo, sempre com atenção ao que você está sentindo. Das 8h às 9h.</p><p><b>Para quem é:</b> adultos de qualquer condicionamento. É mais suave que uma aula de ginástica.</p>',
 canoagem:'<p><b>O que é:</b> remada no Rio Jaguareguava, um rio de águas calmas, rasas e transparentes que corre por áreas preservadas de Bertioga, na transição entre restinga e manguezal, até desaguar no Rio Itapanhaú.</p><p><b>Como funciona:</b> o grupo sai da Marquise do Restaurante e vai de transporte até a base. Lá você recebe colete e remo e rema em caiaque duplo, com monitores, passando por trechos de mangue e pequenas prainhas onde dá para descer e se banhar no rio. Duração de 3h30. O passeio é adaptado e recebe pessoas com deficiência.</p><p><b>Inscrição:</b> no dia anterior, das 9h às 20h, no Balcão da Biblioteca. Sorteio às 21h30.</p><p><b>Dicas:</b> vai molhar, então use roupa de banho e calçado que prenda no pé. Celular só em saco estanque.</p>',
 caderno:'<p><b>Como funciona:</b> oficina no Centro de Educação Ambiental para montar um caderno artesanal e começar a registrar a viagem com desenhos, colagens e anotações. Dura 1h30.</p><p><b>Por que vale:</b> é tranquila, e o caderno serve para guardar as memórias dos próximos dias.</p>',
 mergulho:'<p><b>Como funciona:</b> primeiro, uma bióloga marinha e instrutora profissional de mergulho conversa sobre o equipamento, as regras de segurança e a vida no fundo do mar. Depois, na piscina e com acompanhamento, você coloca o equipamento (máscara, regulador e cilindro de ar) e experimenta respirar embaixo d’água. Das 10h às 12h.</p><p><b>Por que vale:</b> é a chance de testar o mergulho autônomo sem curso e em ambiente seguro.</p><p><b>Dicas:</b> não precisa saber mergulhar. Quem tem problema no ouvido, resfriado ou alguma condição respiratória deve avisar a instrutora antes.</p>',
 reflexo:'<p><b>Como funciona:</b> você fica sentado ou deitado e o terapeuta pressiona pontos da sola dos pés que, segundo a reflexologia, se relacionam com outras partes do corpo. São 10 minutos, duas pessoas por vez, no Espaço do Corpo.</p><p><b>Inscrição:</b> no dia anterior, das 9h às 20h, no Balcão da Biblioteca. Chegue 5 minutos antes do horário.</p>',
 mobiles:'<p><b>O que é:</b> oficina de marcenaria no Espaço de Tecnologias e Artes para construir um móbile de guarás. O guará-vermelho é uma ave de manguezal com penas vermelhas intensas, símbolo da Mata Atlântica do litoral, que voltou a ser visto na região.</p><p><b>Como funciona:</b> você corta, lixa, parafusa e pinta as peças e monta o móbile para levar para casa. Dura 3 horas.</p><p><b>Inscrição:</b> no dia anterior, no Balcão da Biblioteca.</p>',
 ciclohist:'<p><b>Como funciona:</b> o grupo sai da Portaria da Praia com bicicletas emprestadas e pedala pela orla da Praia da Enseada até o Forte São João, no centro de Bertioga, e volta. São cerca de 7 km no total, em ritmo médio, com paradas para contar a história da cidade.</p><p><b>Por que vale:</b> junta exercício, praia e história, e você vê o Forte por fora mesmo sem fazer o passeio de domingo.</p><p><b>Dicas:</b> leve água e use calçado fechado. Uma parte do trajeto é ao sol.</p>',
 quinteto:'<p><b>O que é:</b> concerto do Quinteto Metal Arte, grupo criado em 1991 com dois trompetes, trompa, trombone e tuba. Tocam música renascentista e barroca e também repertório popular.</p><p><b>Como funciona:</b> na Capela, das 16h às 17h, de graça. A acústica da Capela favorece os instrumentos de metal.</p>',
 indiana:'<p><b>O que é:</b> a champi, massagem tradicional indiana ligada à Ayurveda, a medicina tradicional da Índia. São movimentos suaves e profundos no couro cabeludo, pescoço, ombros e rosto.</p><p><b>Como funciona:</b> 10 minutos, sentado, duas pessoas atendidas por vez, no Quiosque Yin Yang.</p><p><b>Inscrição:</b> no dia anterior, das 9h às 20h, no Balcão da Biblioteca. Sorteio às 21h30.</p>',
 praca:'<p><b>O que é:</b> o Jardim da Convivência vira uma grande praça com perna de pau, amarelinha, peteca, corda e outros brinquedos. É voltada a crianças e famílias, mas é aberta a todos.</p>',
 tenismesa:'<p><b>Como funciona:</b> na Área de Convivência, educadores organizam partidas e um torneio recreativo de tênis de mesa (pingue-pongue). Raquetes e bolinhas são fornecidas. Das 20h às 21h.</p><p><b>Para quem é:</b> a partir de 12 anos, de iniciantes a quem já joga.</p>',
 sereia:'<p><b>O que é:</b> peça de teatro com bonecos que conta a história de Inaê, uma menina cadeirante que enfrenta suas limitações e o preconceito. Ela descobre pela mãe uma nova versão da sua história: na verdade, é uma sereia, e por isso não poderia andar como os humanos.</p><p><b>Como funciona:</b> no Espaço Cênico, às 20h30, com 1 hora de duração. Livre para todas as idades.</p>',
 matheus:'<p><b>O que é:</b> dupla mineira formada em 2007, conhecida por animar a noite de música caipira do tradicional Bar Brahma, no centro de São Paulo. Com banda, tocam clássicos sertanejos de raiz de Tonico e Tinoco, José Rico e Milionário, Chitãozinho e Xororó e outros.</p><p><b>Como funciona:</b> na Lanchonete, das 21h30 às 23h, de graça.</p>',
 yoga:'<p><b>O que é:</b> prática de origem indiana que combina exercícios de respiração (pranayama), posturas físicas (asanas) e meditação. Busca relaxamento, autoconhecimento e bem-estar.</p><p><b>Como funciona:</b> na Estação Vivência, perto do mar, das 8h às 9h, em nível iniciante.</p><p><b>Dicas:</b> evite comer muito antes; vá ao café depois. Leve uma canga ou toalha grande para deitar.</p>',
 aves:'<p><b>Como funciona:</b> os Agentes de Educação Ambiental conduzem uma caminhada pelas alamedas, parando para ver e ouvir as aves, reconhecer os cantos e entender seus hábitos. A atividade faz parte do Projeto Avifauna. Sai do Centro de Educação Ambiental às 9h, com 1 hora de duração.</p><p><b>Dica:</b> se quiser, pegue antes um kit Passarinhar com binóculo na Biblioteca.</p>',
 forte:'<p><b>O que é:</b> o Forte São João fica no centro de Bertioga, na entrada do Canal, e é considerado a fortificação mais antiga do Brasil. A primeira defesa no local, uma paliçada de madeira, foi erguida no século 16, na época de Martim Afonso de Souza. A construção em pedra que existe hoje foi concluída por volta de 1765. É tombado pelo IPHAN desde os anos 1940.</p><p><b>O que você vê:</b> a arquitetura militar colonial e uma exposição feita pelo Sesc com a Prefeitura e o IPHAN, que conta a história do Forte por vários pontos de vista, incluindo os povos indígenas e os caiçaras.</p><p><b>Como funciona:</b> o grupo sai da Marquise do Restaurante, com duração de 3 horas e uma caminhada curta. Inscrição no dia anterior, no Balcão da Biblioteca.</p><p><b>Dicas:</b> não é permitido entrar no Forte só de roupa de banho. Leve capa de chuva, como o Sesc recomenda.</p>',
 baleias:'<p><b>Como funciona:</b> bate-papo com os Agentes de Educação Ambiental sobre as baleias que passam pela costa brasileira: como respiram, se alimentam, se reproduzem e até que tamanho chegam. Depois, visita à exposição com o esqueleto de uma baleia-minke, no Nicho da Baleia, ao lado do Centro de Educação Ambiental. Das 11h às 12h.</p>',
 aquaticos:'<p><b>Como funciona:</b> no Parque Aquático, educadores propõem jogos adaptados para a água: basquete, polo aquático e biribol, um vôlei jogado dentro da piscina, em quadra rasa. Das 11h às 12h.</p><p><b>Para quem é:</b> a partir de 13 anos. Não precisa nadar bem.</p>',
 surfar:'<p><b>Como funciona:</b> aula na praia para iniciantes. Primeiro, na areia, você aprende a deitar na prancha, remar e o movimento de ficar em pé. Depois, no mar, com o instrutor por perto, tenta pegar as primeiras ondas.</p><p><b>Inscrição:</b> vagas limitadas, no dia anterior, das 9h às 20h, no Balcão da Biblioteca.</p><p><b>Dicas:</b> camiseta de lycra evita assadura no peito. Passe protetor solar 30 minutos antes de entrar na água.</p>',
 postal:'<p><b>Como funciona:</b> oficina no Centro de Educação Ambiental para criar um cartão-postal com desenho, colagem e pintura, inspirado nas paisagens do Sesc e da Reserva Natural, e enviar para alguém querido. Dura 1h30.</p>',
 auriculo:'<p><b>O que é:</b> técnica da medicina tradicional chinesa que estimula pontos da orelha (o pavilhão auricular). São colocadas pequenas sementes presas com esparadrapo nesses pontos.</p><p><b>Como funciona:</b> 10 minutos, duas pessoas por vez, no Quiosque Yin Yang. As sementes podem ficar na orelha por alguns dias.</p><p><b>Inscrição:</b> no dia anterior, das 9h às 20h, no Balcão da Biblioteca.</p>',
 matahare:'<p><b>O que é:</b> banda de Jaú (SP) com mais de 30 anos de carreira, formada por Dani Reis (voz), Gigão (bateria), Norberto (contrabaixo), Paulo Pin (voz) e PC (guitarra e vocais). Tocam clássicos do pop e do rock nacional e internacional em arranjos próprios.</p><p><b>Como funciona:</b> na Lanchonete, das 21h às 22h30, de graça.</p>',
 ginpraia:'<p><b>Como funciona:</b> aula aberta no Palco da Praia com ginástica geral, exercícios funcionais, dança e desafios de coordenação. Das 11h às 12h.</p><p><b>Dica:</b> no dia do check-out, é uma boa última atividade antes de arrumar as malas, já que a saída é até 14h.</p>'

const $ = s=>document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem('sescb_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('sescb_'+k,JSON.stringify(v))}catch(e){}}
};
let favs = new Set(store.get('fav',[]));
let stamps = new Set(store.get('stamps',[]));
let showKids = store.get('kids',false);
let catFilter = null;

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),2600)}
const m2 = s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const fmt = s=>{const [h,m]=s.split(':');return m==='00'?(+h)+'h':(+h)+'h'+m};
function nowInfo(){
  const d=new Date();
  const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return {iso, min:d.getHours()*60+d.getMinutes(), d};
}
function inTrip(iso){return DAYS.some(x=>x[0]===iso)}
function items(day){
  const list=SCHED[day].map(([s,e,k,pl])=>({day,s,e,k,a:ACTS[k],place:pl||ACTS[k].place,id:day+'|'+s+'|'+k}));
  MEALS(day).forEach(([s,e,k])=>list.push({day,s,e,k,a:ACTS[k],place:'restaurante',id:day+'|'+s+'|'+k,meal:1}));
  return list.sort((a,b)=>m2(a.s)-m2(b.s));
}
function visible(it){return showKids || !it.a.kid}
function inscTag(a){
  if(a.insc==='vespera') return '<span class="tag insc">Inscrição na véspera</span>';
  if(a.insc==='30min') return '<span class="tag insc30">Ingresso 30 min antes</span>';
  return '';
}
function itemHTML(it,ctx){
  const a=it.a, c=CATS[a.cat].c, p=PL[it.place];
  const {iso,min}=nowInfo();
  let cls='item';
  if(it.day===iso){ if(m2(it.e)<=min && it.e!==it.s) cls+=' past'; else if(m2(it.s)<=min && min<m2(it.e)) cls+=' now'; }
  let soon='';
  if(ctx==='next'){const dm=m2(it.s)-min; soon= dm<=0?'<span class="tag soon">agora</span>':'<span class="tag soon">em '+(dm<60?dm+' min':Math.floor(dm/60)+'h'+(dm%60?String(dm%60).padStart(2,'0'):''))+'</span>';}
  const timeLine = it.s===it.e?fmt(it.s):fmt(it.s)+'<small>até '+fmt(it.e)+'</small>';
  return `<div class="${cls}" style="--c:${c}">
    <button class="t" data-open="${it.id}" style="text-align:left">${timeLine}</button>
    <button data-open="${it.id}" style="text-align:left">
      <div class="nm">${a.n}</div>
      <div class="meta">${p?p.n:''}</div>
      <div class="tags">${soon}${a.cat!=='refeicao'?`<span class="tag cat" style="--c:${c}">${CATS[a.cat].n}</span><span class="tag">${a.age}</span>`:''}${inscTag(a)}</div>
    </button>
    ${it.meal||a.cat==='refeicao'?'<span></span>':`<button class="star ${favs.has(it.id)?'on':''}" data-fav="${it.id}" aria-label="Favoritar">★</button>`}
  </div>`;
}
function findItem(id){const day=id.split('|')[0];return items(day).find(x=>x.id===id)}

/* ---------- AGORA ---------- */
function renderAgora(){
  const {iso,min,d}=nowInfo();
  const day = inTrip(iso)?iso:DAYS[0][0];
  const di = DAYS.findIndex(x=>x[0]===day);
  let h='';
  h+=`<div class="clock"><b>${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</b><span>${DAYS[di][3]}</span></div>`;
  if(!inTrip(iso)) h+=`<div class="alert calm"><h3>Fora das datas da viagem</h3><p>Mostrando a programação de quinta, 29.</p></div>`;
  // inscrições para amanhã
  const next = DAYS[di+1];
  if(next && inTrip(iso)){
    const vesp = items(next[0]).filter(it=>it.a.insc==='vespera'&&visible(it));
    const uniq=[]; const seen=new Set(); vesp.forEach(it=>{if(!seen.has(it.k)){seen.add(it.k);uniq.push(it)}});
    if(uniq.length){

  const la=Math.hypot(GN[2*sa.b]-GN[2*sa.a],GN[2*sa.b+1]-GN[2*sa.a+1]);
  const {dist,prev}=dijkstra([[sa.a,sa.t*la],[sa.b,(1-sa.t)*la]]);
  const lb=Math.hypot(GN[2*sb.b]-GN[2*sb.a],GN[2*sb.b+1]-GN[2*sb.a+1]);
  const ea=dist[sb.a]+sb.t*lb, eb=dist[sb.b]+(1-sb.t)*lb;
  let end=ea<=eb?sb.a:sb.b, cost=Math.min(ea,eb);
  if(!isFinite(cost)) return {pts:[[ax,ay],[bx,by]],len:direct};
  // mesmo trecho: anda direto pela aresta
  const same=(sa.a===sb.a&&sa.b===sb.b)||(sa.a===sb.b&&sa.b===sb.a);
  if(same&&Math.hypot(sb.x-sa.x,sb.y-sa.y)<cost) return {pts:[[ax,ay],[sa.x,sa.y],[sb.x,sb.y],[bx,by]],len:sa.d+Math.hypot(sb.x-sa.x,sb.y-sa.y)+sb.d};
  const chain=[];for(let n=end;n!==-1;n=prev[n])chain.push([GN[2*n],GN[2*n+1]]);chain.reverse();
  return {pts:[[ax,ay],[sa.x,sa.y],...chain,[sb.x,sb.y],[bx,by]],len:sa.d+cost+sb.d};
}
let rCache=null;
function routeTo(mp,p){
  const bx=p.x*MW,by=p.y*MH;
  if(rCache&&rCache.dest===p.id&&Math.hypot(rCache.ax-mp[0],rCache.ay-mp[1])<6) return rCache.r;
  const r=walkRoute(mp[0],mp[1],bx,by); rCache={dest:p.id,ax:mp[0],ay:mp[1],r}; return r;
}

/* ---- vista ---- */
function clampView(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  const minS=Math.min(w/MW,h/MH)*0.95; S=Math.max(minS,Math.min(5,S));
  const iw=MW*S, ih=MH*S;
  TX = iw<w ? (w-iw)/2 : Math.min(40,Math.max(w-iw-40,TX));
  TY = ih<h ? (h-ih)/2 : Math.min(120,Math.max(h-ih-90,TY));
}
function toScreen(x,y){return [TX+x*S,TY+y*S]}
function centerOn(x,y,s){ if(s) S=s; TX=wrap.clientWidth/2-x*S; TY=wrap.clientHeight/2-y*S; clampView(); renderMap(); }
function initMap(){
  if(mapInit) return; mapInit=true;

}
function renderChips(){
  $('#mapchips').innerHTML=`<button class="chip" aria-pressed="${!mapFilter}" data-mf="">Tudo</button>`+Object.entries(PTYPE).filter(([k,v])=>v.ids.some(id=>PL[id])).map(([k,v])=>`<button class="chip cat" style="--c:${v.c}" aria-pressed="${mapFilter===k}" data-mf="${k}">${v.n}</button>`).join('');
}
let rq=0; function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;if(mapInit)renderMap()})}
function visiblePlaces(){return PLACES.filter(p=>!mapFilter||TYPEOF[p.id]===mapFilter||p.id===dest)}
function pinFace(p){return p.num?`<b>${p.num}</b>`:(ICON[p.id]||'📍')}
function renderMap(){
  clampView();
  layer.style.transform=`translate(${TX}px,${TY}px) scale(${S})`;
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const tiny=S<0.45&&!mapFilter;
  const must=p=>p.id===dest||p.id==='quarto';
  const sorted=visiblePlaces().sort((a,b)=>(must(b)-must(a))||prio(a.id)-prio(b.id)||(a.num||99)-(b.num||99));
  const R=tiny?9:15, hit=(box,list)=>list.some(b=>!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3]));
  // 1º os círculos (quem colide com outro de maior prioridade fica escondido até aproximar o zoom)
  const shown=[], circles=[];
  sorted.forEach(p=>{
    const [x,y]=toScreen(p.x*MW,p.y*MH);
    if(x<-60||y<-60||x>W+60||y>H+60) return;
    const box=[x-R+3,y-R+3,x+R-3,y+R-3];
    if(!must(p)&&hit(box,circles)) return;
    circles.push(box); shown.push([p,x,y]);
  });
  let h='';
  if(S>1.1) DUPES.forEach(d=>{
    const p=PL[d.of]; if(!p||(mapFilter&&TYPEOF[p.id]!==mapFilter)) return;
    const [x,y]=toScreen(d.x*MW,d.y*MH); if(x<-30||y<-30||x>W+30||y>H+30) return;
    const box=[x-8,y-8,x+8,y+8]; if(hit(box,circles)) return; circles.push(box);
    h+=`<div class="pin tiny dup" style="left:${x}px;top:${y}px;--c:${PTYPE[p.cat].c}"><i>${pinFace(p)}</i></div>`;
  });
  // 2º os nomes, sem cobrir outros círculos nem outros nomes
  const labels=[];
  shown.forEach(([p,x,y])=>{
    const t=PTYPE[TYPEOF[p.id]]||PTYPE.hosp;
    const name=p.n.replace(/ \(.*\)/,'');
    const isDest=p.id===dest;
    let lbl=false;
    if(must(p)||(!tiny&&(S>1.6||prio(p.id)<99||mapFilter))){
      const w=Math.min(name.length,34)*6.6+14, box=[x+R+2,y-11,x+R+4+w,y+11];
      if(must(p)||(!hit(box,labels)&&!hit(box,circles))){labels.push(box);lbl=true}
    }
    h+=`<div class="pin${p.num?' num':''}${isDest?' dest':''}${lbl?' lbl':''}${tiny&&!isDest?' tiny':''}${p.id==='quarto'?' room':''}" style="left:${x}px;top:${y}px;--c:${t.c}"><i>${pinFace(p)}</i><span>${name}</span></div>`;
  });
  let svg='';
  const mp=mePx();
  if(dest&&PL[dest]&&mp&&nearSesc(mp[0],mp[1])){
    const r=routeTo(mp,PL[dest]);
    const d=r.pts.map((q,i)=>{const [x,y]=toScreen(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}).join('');
    svg=`<path d="${d}" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><path d="${d}" fill="none" stroke="#1E6BFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="1 11" stroke-linecap="round" opacity=".9"/>`;
  }
  if(mp){
    const [x,y]=toScreen(mp[0],mp[1]);
    const r=Math.max(12,(me.acc||10)*T.ppm*S);
    const hd = compass!=null?compass:(me.heading!=null&&!isNaN(me.heading)?me.heading:null);
    h+=`<div class="me" style="left:${x}px;top:${y}px"><div class="acc" style="width:${2*r}px;height:${2*r}px"></div>${hd!=null?`<div class="cone" style="transform:translate(-50%,-100%) rotate(${hd}deg)"></div>`:''}<div class="d"></div></div>`;
  }
  pinsEl.innerHTML=h; ov.innerHTML=svg;
  $('#north').style.display='grid';
  const pill=$('#gpsPill'); let msg='';
  if(gpsOn&&!dest){
    if(!me) msg='Procurando sua localização…';
    else if(!mp||!nearSesc(mp[0],mp[1])){const pt=PL.portaria;const [E,N]=local(me.lat,me.lng,{lat:pt.lat,lng:pt.lng});const km=Math.hypot(E,N)/1000;msg=`Você está fora do Sesc, a ${km<1?Math.round(km*1000)+' m':km.toFixed(km<10?1:0).replace('.',',')+' km'} da Portaria`}
    else msg=`Você está aqui · precisão ±${Math.round(me.acc)} m`;
  } else if(!gpsOn&&gpsMsg&&!dest) msg=gpsMsg;
  pill.style.display=msg?'block':'none'; pill.textContent=msg;
  updateNav();
}
function mePx(){if(!me)return null;return geoPx(me.lat,me.lng)}
function fmtDist(m){return m<1000?Math.max(5,Math.round(m/5)*5)+' m':(m/1000).toFixed(1).replace('.',',')+' km'}
function updateNav(){
  const bar=$('#navbar');
  if(!dest){bar.classList.remove('on');return}
  bar.classList.add('on');
  const p=PL[dest];
  const mp=mePx();
  if(!mp){
    $('#navDist').textContent= !gpsOn?'Toque para ligar o GPS':'Procurando sua localização…';
    $('#navName').textContent=p.n;
    $('#navArrow').style.transform='none'; return;
  }
  if(!nearSesc(mp[0],mp[1])){
    $('#navDist').textContent='Você está fora do Sesc';$('#navName').textContent='A rota aparece quando você entrar. Destino: '+p.n;$('#navArrow').style.transform='none';return;
  }
  const r=routeTo(mp,p), m=r.len/T.ppm;
  // aponta para o primeiro ponto da rota a uns 12 m de distância
  let tgt=r.pts[r.pts.length-1];
  for(const q of r.pts){if(Math.hypot(q[0]-mp[0],q[1]-mp[1])>12*T.ppm){tgt=q;break}}
  const mapAng=Math.atan2(tgt[0]-mp[0],-(tgt[1]-mp[1]))*180/Math.PI;
  let hint=p.n, rot=mapAng;
  if(compass!=null){
    rot=((mapAng-compass)%360+540)%360-180;
    const a=Math.abs(rot);
    hint=(a<25?'Siga em frente':a>150?'Dê meia-volta':rot>0?'Vire à direita':'Vire à esquerda')+' para '+p.n;
  }
  if(m<15){$('#navDist').textContent='Você chegou';$('#navName').textContent=p.n;if(!arrived){arrived=true;toast('Você chegou: '+p.n);if(navigator.vibrate)navigator.vibrate(200)}}
  else{arrived=false;$('#navDist').textContent=fmtDist(m)+' · '+Math.max(1,Math.round(m/70))+' min a pé';$('#navName').textContent=hint}
  $('#navArrow').style.transform=`rotate(${rot}deg)`;
}
function startRoute(id){
  dest=id; arrived=false; rCache=null; closeSheet(); show('mapa');
  requestAnimationFrame(()=>{
    initMap();
    const p=PL[id]; const mp=mePx();
    if(mp&&nearSesc(mp[0],mp[1])){ follow=false; const cx=(mp[0]+p.x*MW)/2, cy=(mp[1]+p.y*MH)/2; const span=Math.max(Math.abs(mp[0]-p.x*MW)/(wrap.clientWidth-150),Math.abs(mp[1]-p.y*MH)/(wrap.clientHeight-300)); const s=Math.min(3,Math.max(0.35,1/Math.max(span,0.3))); centerOn(cx,cy,s); }
    else centerOn(p.x*MW,p.y*MH,Math.max(S,1.6));
    if(!gpsOn) setGps(true);
  });
}
function onOrient(e){let hd=null;if(e.webkitCompassHeading!=null)hd=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)hd=360-e.alpha;if(hd!=null){const so=(screen.orientation&&screen.orientation.angle)||0;compass=(hd+so+360)%360;scheduleRender()}}
let compassOn=false;
async function startCompass(){
  if(compassOn) return;
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')return}}catch(e){return}
  compassOn=true;
  window.addEventListener('deviceorientationabsolute',onOrient,true);
  window.addEventListener('deviceorientation',onOrient,true);
}
let gpsMsg='';
function gpsHelp(code){
  if(inFrame) return 'Dentro do Claude o navegador não libera o GPS para a página. Abra o endereço do guia (github.io) no Safari ou Chrome, ou use a versão instalada no celular.';
  if(code===1) return 'A localização foi negada. No iPhone: Ajustes > Privacidade e Segurança > Serviços de Localização > Safari (ou Sites do Safari) > “Ao Usar o App”, com “Localização Precisa” ligada. No Android: toque no cadeado ao lado do endereço > Permissões > Localização > Permitir. Depois toque no botão de GPS do mapa.';
  return 'Não consegui achar sua posição. Vá para um lugar aberto, longe de telhados, e tente de novo. O GPS funciona mesmo sem internet, mas pode levar até 1 minuto para pegar sinal.';
}
function gpsError(code){
  if(code!==1&&me) return; // falha passageira com posição já conhecida: segue acompanhando
  const auto=gpsAuto; setGps(false);
  gpsMsg=code===1?'Localização bloqueada. Toque no botão de GPS para ver como liberar.':'GPS indisponível. Toque no botão de GPS para tentar de novo.';
  if(!auto) openSheet(`<div class="hd" style="--c:var(--coral)"><h3>GPS indisponível</h3></div><p>${gpsHelp(code)}</p>`);
  scheduleRender();
}
function setGps(on){
  gpsOn=on; $('#btnGps').classList.toggle('on',on);
  if(on){
    if(!('geolocation' in navigator)||!window.isSecureContext||inFrame){gpsOn=false;$('#btnGps').classList.remove('on');openSheet(`<div class="hd" style="--c:var(--coral)"><h3>GPS indisponível</h3></div><p>${gpsHelp(0)}</p>`);return}
    gpsMsg='';
    if(!gpsAuto) startCompass();
    watchId=navigator.geolocation.watchPosition(pos=>{
      me={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,heading:pos.coords.heading};
      store.set('gpsOk',1);
      const mp=mePx();
      if(mp&&nearSesc(mp[0],mp[1])){
        if(!centeredOnce&&!dest){centeredOnce=true;follow=true;S=Math.max(S,wrap.clientWidth/MW*2.6)}
        if(follow){TX=wrap.clientWidth/2-mp[0]*S;TY=wrap.clientHeight/2-mp[1]*S}
      }
      gpsAuto=false;
      scheduleRender();
    },err=>gpsError(err.code),{enableHighAccuracy:true,maximumAge:2000,timeout:60000});
  } else { if(watchId!=null)navigator.geolocation.clearWatch(watchId); watchId=null; me=null; gpsAuto=false; scheduleRender(); }
}

/* gestos */
const ptr=new Map(); let g=null;
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('.mapctl,.mapsearch,.navbar,.mapchips,#gpsPill')) return;
  startCompass();
  wrap.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1) g={mode:'pan',sx:e.clientX,sy:e.clientY,tx:TX,ty:TY,t:Date.now(),moved:0};
  else if(ptr.size===2){const [a,b]=[...ptr.values()];const r=wrap.getBoundingClientRect();g={mode:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),s:S,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,tx:TX,ty:TY,moved:99}}
});
wrap.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId)||!g) return; ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.mode==='pan'&&ptr.size===1){TX=g.tx+e.clientX-g.sx;TY=g.ty+e.clientY-g.sy;g.moved=Math.max(g.moved,Math.hypot(e.clientX-g.sx,e.clientY-g.sy));if(g.moved>8)follow=false;scheduleRender()}
  else if(g.mode==='pinch'&&ptr.size===2){const [a,b]=[...ptr.values()];const ns=Math.max(0.2,Math.min(5,g.s*Math.hypot(a.x-b.x,a.y-b.y)/g.d));const ix=(g.mx-g.tx)/g.s,iy=(g.my-g.ty)/g.s;S=ns;TX=g.mx-ix*S;TY=g.my-iy*S;follow=false;scheduleRender()}
});
function endPtr(e){
  if(!ptr.has(e.pointerId)) return; ptr.delete(e.pointerId);
  if(g&&g.mode==='pan'&&g.moved<8&&Date.now()-g.t<450){const r=wrap.getBoundingClientRect();handleTap(e.clientX-r.left,e.clientY-r.top)}
  if(ptr.size===0) g=null; else if(ptr.size===1){const [a]=[...ptr.values()];g={mode:'pan',sx:a.x,sy:a.y,tx:TX,ty:TY,t:0,moved:99}}
}
wrap.addEventListener('pointerup',endPtr); wrap.addEventListener('pointercancel',endPtr);
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const ix=(mx-TX)/S,iy=(my-TY)/S;S=Math.max(0.2,Math.min(5,S*Math.exp(-e.deltaY*0.0015)));TX=mx-ix*S;TY=my-iy*S;follow=false;scheduleRender()},{passive:false});
let lastTap=0;
function setRoomAt(x,y,label){room={x,y,label};store.set('room2',room);applyRoom();rCache=null;renderMap()}
function handleTap(sx,sy){
  const ix=(sx-TX)/S, iy=(sy-TY)/S;
  if(roomMode){roomMode=false;setRoomAt(ix,iy,'');toast('Seu quarto foi marcado. Use “Para onde você quer ir?” para voltar até ele.');return}
  const now=Date.now(); if(now-lastTap<300){lastTap=0;zoomAt(sx,sy,1.8);return} lastTap=now;
  let best=null,bd=28;
  visiblePlaces().forEach(p=>{const [x,y]=toScreen(p.x*MW,p.y*MH);const d=Math.hypot(x-sx,y-sy);if(d<bd){bd=d;best=p}});
  if(S>0.7) DUPES.forEach(d=>{const p=PL[d.of];if(!p||(mapFilter&&TYPEOF[p.id]!==mapFilter))return;const [x,y]=toScreen(d.x*MW,d.y*MH);const dd=Math.hypot(x-sx,y-sy);if(dd<bd){bd=dd;best=p}});
  if(best) setTimeout(()=>{if(lastTap===now)openPlace(best.id)},280);
}
function zoomAt(cx,cy,f){const ix=(cx-TX)/S,iy=(cy-TY)/S;S=Math.max(0.2,Math.min(5,S*f));TX=cx-ix*S;TY=cy-iy*S;follow=false;renderMap()}

  $('#main').scrollTop=0;
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-fav],[data-go],[data-route],[data-day],[data-cat],[data-stamp],#doInstall');
  if(!t) return;
  if(t.dataset.fav){const id=t.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);store.set('fav',[...favs]);toast(favs.has(id)?'Adicionado ao roteiro':'Removido do roteiro');refresh();if($('#sheet').classList.contains('on')&&t.closest('#sheet'))openItem(id);return}
  if(t.id==='doInstall'){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderServ()})}return}
  if(t.dataset.open){openItem(t.dataset.open);return}
  if(t.dataset.go){startRoute(t.dataset.go);return}
  if(t.dataset.route){startRoute(t.dataset.route);return}
  if(t.dataset.day){agDay=t.dataset.day;catFilter=null;renderAgenda();return}
  if(t.dataset.cat!==undefined){catFilter=t.dataset.cat||null;renderAgenda();return}
  if(t.dataset.stamp){const id=t.dataset.stamp;t.checked?stamps.add(id):stamps.delete(id);store.set('stamps',[...stamps]);renderPass();if(stamps.size===10)toast('Passaporte completo!');return}
});
document.addEventListener('change',e=>{if(e.target.id==='kids'){showKids=e.target.checked;store.set('kids',showKids);renderAgenda()}});
$('#scrim').onclick=closeSheet; $('#sheetX').onclick=closeSheet;
function refresh(){const v=VIEWS.find(x=>$('#'+x).classList.contains('on'));if(v==='agora')renderAgora();if(v==='agenda')renderAgenda()}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if($('#servicos').classList.contains('on'))renderServ()});
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installCard(){
  if(isStandalone()) return '<div class="install"><h3>App instalado</h3><p>Tudo fica salvo no celular: agenda, mapa e GPS funcionam mesmo sem internet.</p></div>';
  if(inFrame) return '<div class="install"><h3>Instalar no celular</h3><p>Aqui dentro do Claude não dá para instalar nem usar o GPS. Abra o endereço do seu guia publicado (github.io) no Safari ou Chrome e instale por lá.</p></div>';
  if(deferredPrompt) return '<div class="install"><h3>Instalar no celular</h3><p>Vira um app na tela inicial e funciona offline.</p><div class="btnrow"><button class="btn" id="doInstall">Instalar agora</button></div></div>';
  if(isIOS) return '<div class="install"><h3>Instalar no iPhone</h3><ol><li>Abra este endereço no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (quadrado com seta).</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li><li>Abra pelo ícone novo uma vez com internet. Depois funciona offline.</li></ol></div>';
  return '<div class="install"><h3>Instalar no celular</h3><ol><li>No Chrome, toque no menu ⋮.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Abra pelo ícone uma vez com internet. Depois funciona offline.</li></ol></div>';
}
function netState(){const el=$('#hNet');if(!el)return;el.style.display=navigator.onLine?'none':'inline-block'}
window.addEventListener('online',netState);window.addEventListener('offline',netState);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!inFrame){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
function header(){const {d}=nowInfo();$('#hSub').textContent='Sua programação de quinta, 29, a segunda, 2 de novembro'}
header();netState();
show(location.hash.slice(1)||'agora');
setInterval(()=>{const v=VIEWS.find(x=>$('#'+x).classList.contains('on'));if(v==='agora')renderAgora()},60000);
</script>
</body>
</html>
